name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  link:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Node Test
        env:
          BROWSERSTACK_USERNAME: emberclibrowsersDv86d
          # This is in plaintext on purpose. It has no privileged access to anything
          # and allows us to run BrowserStack on pull-requests
          BROWSERSTACK_ACCESS_KEY: aeqUXusvriNdmYFQpbrj
        run: pnpm --filter src test:node
      - name: Run Smoke Test
        env:
          BROWSERSTACK_USERNAME: emberclibrowsersDv86d
          # This is in plaintext on purpose. It has no privileged access to anything
          # and allows us to run BrowserStack on pull-requests
          BROWSERSTACK_ACCESS_KEY: aeqUXusvriNdmYFQpbrj
        run: pnpm --filter test-app browserstack-smoke-test
